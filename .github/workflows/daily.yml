name: 每日舆情日报

# 触发方式说明（2026-10-09 修订）
#   主通道：外部机器（Windows 任务计划）每天 10:00 通过 API dispatch 触发 —— 准点
#   兜底：  下面的 schedule 仅作保险。GitHub 对低活跃仓库的定时任务会延迟数小时，
#           所以脚本内加了「今日已推送则跳过」守卫，避免兜底触发造成重复推送。

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      no_push:
        description: '仅生成页面，跳过飞书推送'
        type: boolean
        default: false
      force:
        description: '忽略「今日已推送」检查，强制执行'
        type: boolean
        default: false

concurrency:
  group: report-daily
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 防重复检查（今日是否已成功推送）
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "force=true，跳过防重复检查"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY=$(TZ=Asia/Shanghai date +%F)
          LAST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/runs?status=success&per_page=20" \
                 --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .run_started_at" 2>/dev/null | head -1 || true)

          if [ -z "$LAST" ] || [ "$LAST" = "null" ]; then
            echo "无历史成功记录，继续执行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_DAY=$(TZ=Asia/Shanghai date -d "$LAST" +%F)
          echo "今天(北京)=$TODAY / 上次成功=$LAST (北京日期 $LAST_DAY)"

          if [ "$LAST_DAY" = "$TODAY" ]; then
            echo "::notice::今日已成功推送过，跳过本次重复执行"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 运行日报脚本
        if: steps.guard.outputs.skip != 'true'
        run: python taptap_daily.py ${{ inputs.no_push && '--no-push' || '' }}

      - name: 构建 GitHub Pages 站点
        if: steps.guard.outputs.skip != 'true'
        run: python build_site.py

      - name: 部署到 GitHub Pages
        if: steps.guard.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
